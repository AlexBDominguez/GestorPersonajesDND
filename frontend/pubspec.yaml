name: gestor_personajes_dnd
description: Gestor de personajes para D&D 5e inspirado en DNDBeyond
publish_to: 'none'
version: 1.0.0+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  material_design_icons_flutter: ^7.0.0
  
  # HTTP Client
  http: ^1.2.0
  
  # State Management (MVVM)
  provider: ^6.1.0
  
  # JSON Serialization
  json_annotation: ^4.9.0
  
  # Utilities
  shared_preferences: ^2.2.2  # Para guardar token JWT localmente
  flutter_secure_storage: ^9.2.2 # Almacenamiento seguro para refresh token
  intl: ^0.18.1               # Formateo de fechas, números, etc.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code generation para JSON
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Libre Baskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville-wght.ttf
          weight: 400
        - asset: assets/fonts/LibreBaskerville-wght.ttf
          weight: 700
        - asset: assets/fonts/LibreBaskerville-Italic-wght.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/LibreBaskerville-Italic-wght.ttf
          style: italic
          weight: 700
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Lato-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lato-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-BoldItalic.ttf
          weight: 700
          style: italic
  

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon.png
  min_sdk_android: 21