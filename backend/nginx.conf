server {
    listen 80;
    server_name _;  # Reemplazar con el dominio cuando se tenga: server_name tu-dominio.com;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip para reducir tamaño de assets de Flutter
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Assets de Flutter (JS, wasm, fonts, etc.) — cache agresiva
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy de todas las llamadas al backend
    location /api/ {
        proxy_pass http://backend:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta desconocida devuelve index.html (Flutter router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

